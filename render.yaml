databases:
  - name: vaayuvega-db
    plan: free
    databaseName: vaayuvega
    user: vaayuvega

services:
  - type: web
    name: vaayuvega
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vaayuvega-db
          property: connectionString
